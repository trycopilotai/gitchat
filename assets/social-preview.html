<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>gitchat</title>
    <style>
      html,
      body {

        height: 640px;

        padding: 72px 80px;

      .name {

        margin-top: 44px;
        font-size: 24px;

        color: #ffd166;
      }
      .command {
        color: #55d6be;
      }
      .foot {

  <body>
    <div class="name">gitchat</div>

      <div class="command">$ poll --repo beta --slug beta --all</div>
